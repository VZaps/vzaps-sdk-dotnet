name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build packages without publishing
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - id: version
        shell: bash
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' src/VZaps.SDK/VZaps.SDK.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "v$version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v$version" >&2
            exit 1
          fi

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
        env:
          CI: true
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack src/VZaps.SDK/VZaps.SDK.csproj --configuration Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  publish:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - shell: bash
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: artifacts/*
